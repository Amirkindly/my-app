name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -o VerseVPN-hop2.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build native parts (Xray, tun2socks, OpenVPN)
        run: bash VerseVPN/ci/native.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-log
          path: VerseVPN/ci/native.log
          if-no-files-found: ignore
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build
        working-directory: VerseVPN
        run: gradle assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: VerseVPN-apk
          path: VerseVPN/app/build/outputs/apk/release/*.apk
