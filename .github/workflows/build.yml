name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Locate project
        run: |
          if [ -f app/build.gradle.kts ]; then PROJ=.
          elif [ -f VerseVPN/app/build.gradle.kts ]; then PROJ=VerseVPN
          else
            Z=$(ls -t *.zip 2>/dev/null | head -1)
            if [ -n "$Z" ]; then
              echo "Unzipping $Z"
              unzip -oq "$Z"
              PROJ=VerseVPN
            else
              echo "Project not found. Repo contents:"; ls -R | head -60; exit 1
            fi
          fi
          echo "Using project dir: $PROJ"
          echo "PROJ=$PROJ" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build native parts (Xray, tun2socks, OpenVPN)
        run: bash "$PROJ/ci/native.sh"
      - name: Check native libs
        run: |
          for f in libhev-socks5-tunnel.so libovpnexec.so libopenvpn.so; do
            if [ -f "$PROJ/app/src/main/jniLibs/arm64-v8a/$f" ]; then echo "OK      $f"; else echo "::warning::MISSING $f"; fi
          done
          [ -f "$PROJ/app/libs/libv2ray.aar" ] && echo "OK      libv2ray.aar" || echo "::warning::MISSING libv2ray.aar"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-log
          path: ${{ env.PROJ }}/ci/native.log
          if-no-files-found: ignore
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build
        working-directory: ${{ env.PROJ }}
        run: gradle assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: VerseVPN-apk
          path: ${{ env.PROJ }}/app/build/outputs/apk/release/*.apk
